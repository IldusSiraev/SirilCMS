services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payload}
      POSTGRES_USER: ${POSTGRES_USER:-payload}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [ pgdata:/var/lib/postgresql/data ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-payload} -d ${POSTGRES_DB:-payload}"]
      interval: 5s
      timeout: 5s
      retries: 10
  admin:
    build:
      context: ..
      dockerfile: infra/docker/admin.Dockerfile
    env_file: ../.env
    restart: unless-stopped
    environment:
      PAYLOAD_DB_URI: postgresql://${POSTGRES_USER:-payload}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-payload}
      PORT: "3001"
    ports:
      - "3001:3001"
    volumes:
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args: { PAYLOAD_URL: 'http://admin:3001', NUXT_PUBLIC_MEDIA_BASE: 'https://admin.${SITE_DOMAIN}' }
    env_file: ../.env
    restart: unless-stopped
    environment: { PAYLOAD_URL: 'http://admin:3001' }
    depends_on: [ admin ]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: { SITE_DOMAIN: ${SITE_DOMAIN:-localhost} }
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_conf:/config
    depends_on: [ web, admin ]
volumes: { pgdata: {}, caddy_data: {}, caddy_conf: {}, media_data: {} }
