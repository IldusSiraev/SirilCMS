name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: payload
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PAYLOAD_SECRET: ci-secret-at-least-32-characters-long
      PAYLOAD_DB_URI: postgresql://payload:dev@localhost:5432/payload
      PAYLOAD_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply all migrations to a clean database
        run: pnpm --filter @siril/admin migrate

      - name: Check for schema drift (collection change without a matching migration)
        run: |
          echo "n" | pnpm --filter @siril/admin migrate:generate -- --name ci_schema_drift_check
          if [ -n "$(git status --porcelain apps/admin/src/migrations/)" ]; then
            echo "::error::Collection schema doesn't match the latest migration. Run 'pnpm --filter @siril/admin migrate:generate' locally and commit the generated migration."
            git status --porcelain apps/admin/src/migrations/
            git diff -- apps/admin/src/migrations/
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: payload
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PAYLOAD_SECRET: ci-secret-at-least-32-characters-long
      PAYLOAD_DB_URI: postgresql://payload:dev@localhost:5432/payload
      PAYLOAD_URL: http://localhost:3001
      NUXT_PUBLIC_SITE_DOMAIN: localhost:3000
      PURGE_TOKEN: ci-purge-token
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all workspaces
        run: pnpm -r build

  publish:
    name: Publish ${{ matrix.image }} image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, typecheck, test, migrations, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: admin
            dockerfile: infra/docker/admin.Dockerfile
            target: ''
          - image: web
            dockerfile: infra/docker/web.Dockerfile
            target: ''
          # admin's runtime image is a Next.js standalone build — no node_modules/payload/bin.js,
          # no src/migrations, no ts-loader script. `pnpm --filter @siril/admin migrate` needs the
          # full pre-build stage instead, published as its own (much larger) image.
          - image: admin-migrate
            dockerfile: infra/docker/admin.Dockerfile
            target: build
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name (GHCR requires lowercase)
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
